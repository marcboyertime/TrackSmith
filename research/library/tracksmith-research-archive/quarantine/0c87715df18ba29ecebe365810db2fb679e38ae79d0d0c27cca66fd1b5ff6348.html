g the background texture. This can then be shaped and smoothed using other new processes in this version."},{"name":"image","title":"","alt":"","alt_long":"","id":"992885","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_small_500px/992885-small.png","width":"500","height":"292"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_medium_1000px/992885-medium.png","width":"1000","height":"584"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_large_2000px/992885-large.png","width":"2000","height":"1168"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_extra-large_5500px/992885-extra-large.png","width":"3420","height":"1998"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"Video - SpectraLayers 13 - New in - 17fpH3C4EIU","assetId":"995670","youtubeId":"17fpH3C4EIU","youtubeTitle":"","youtubeStart":"20","youtubeEnd":"74"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain-big-image","id":"992277","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"headline","type":"h3","content":"Ambience Heal"},{"name":"text","type":"regular","content":"Automatically fill empty spaces in the audio spectrum left by unmixing and cut-to operations. For example, empty spaces previously occupied by voices on a source layer can be filled with the surrounding background texture (environment, room tone, etc) already present in the layer. The process references user-designated foreground layers containing content extracted from the source layer."},{"name":"image","title":"","alt":"","alt_long":"","id":"992887","alignment":"right","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992887/storage/PNG_small_500px/992887-small.png","width":"500"," ","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":4,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Search Modules by Name and Keyword","name":"headline"},{"type":"regular","content":"Quickly locate modules directly by name, or use keywords describing associated categories, functions, or concepts — such as speech, noise, heal, and ambience.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"448","youtubeStart":"419","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":5,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"New Metering Options","name":"headline"},{"type":"regular","content":"The VU meter can now display peaks, RMS, or loudness. Other new metering features include a dedicated module which can dynamically provide comprehensive loudness data for entire projects, any combination of layers, and even selections in the spectrograph.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"492","youtubeStart":"476","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":6,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Module Information Help","name":"headline"},{"type":"regular","content":"When Tooltips are active, hovering over a module in the Modules panel or a module help icon displays descriptions of its functionality, keyboard shortcuts, and whether the module is affected by the currently selected FFT size.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"476","youtubeStart":"448","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":7,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"New Shortcuts","name":"headline"},{"type":"regular","content":"Easily assign keyboard shortcuts for interface layouts, tool presets, module presets, and module preset apply commands. Keyboard shortcut assignments are now available for more than 100 functions.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"209","youtubeStart":"183","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]}],"name":"tiles"}],"categories":[{"name":"Category Wall - New in - SpectraLayers 13"}]},{"type":"steinberg--text-media","variant":"intro","id":"992323","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Other Improvements"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992329","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"tag","type":"regular","content":"Elements"},{"name":"headline","type":"h3","content":"Batch Process Open Projects"},{"name":"text","type":"regular","content":"The full range of sophisticated batch processing options in SpectraLayers can now be applied across multiple open projects at once. Activate target projects in turn and choose specific layers for processing, then select the projects in the Batch Process Project Tabs dialog, define your modules chain, and apply. This new functionality is directly accessible in the main SpectraLayers interface, as well as via dropdown menu and keyboard shortcut."},{"name":"image","title":"","alt":"","alt_long":"","id":"992925","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_small_500px/992925-small.png","width":"500","height":"373"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992 -large.png","width":"2575","height":"1996"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"xjH6Tt9eW0k - Video - SpectraLayers 13 - New in","assetId":"995672","youtubeId":"xjH6Tt9eW0k","youtubeTitle":"","youtubeStart":"492","youtubeEnd":"593"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992332","columnNumber":2,"content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"tag","type":"regular","content":"Elements"},{"name":"headline","type":"h3","content":"More Than 128 Device Channels"},{"name":"text","type":"regular","content":"SpectraLayers can now integrate audio devices with channels mapped beyond the 128th device channel, supporting larger and more complex routing configurations for immersive audio, post-production, and high-channel-count studio environments."}]},{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"tag","type":"regular","content":"Elements"},{"name":"headline","type":"h3","content":"Transcript Export Options"},{"name":"text","type":"regular","content":"The Unmix Transcription module can now export to more frame rates, such as 23.976 fps. Generate highly accurate and easily editable transcripts."}]}]}]},{"type":"steinberg--shop-tiles","variant":"buy-now-detailed-no-image","id":"699215","content":[{"type":"h2","content":"Buy SpectraLayers","name":"headline"},{"children":[{"sapProductNumber":"92664","productId":"894094","order":1,"skuId":"990229"},{"sapProductNumber":"92665","productId":"894094","order":2,"skuId":"990420"},{"sapProductNumber":"92672","productId":"894095","order":3,"skuId":"991020"}],"name":"tiles"}]},{"type":"steinberg--shop","variant":"","id":"306753","content":[{"productName":"SpectraLayers Pro 13","productFamily":"SpectraLayers 13","productId":"894094","productType":"Software","description":"","descriptionShort":"","image":{"title":"SpectraLayers Pro 13 - Key Image","id":"993263","src":[{"type":"small", ories":[],"content":[{"type":"h3","content":"Disable Selection Fades","name":"headline"},{"type":"regular","content":"Selection fades can now be switched on and off via menu or shortcut commands, letting you switch between sharp selection edges and programmed fades on the fly.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"357","youtubeStart":"334","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":2,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Interface Layout Presets","name":"headline"},{"type":"regular","content":"Save and recall interface states, including module and toolbar settings, for frequently used scenarios. Interface states can include anything that can be shown, hidden, docked, moved, or resized.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"183","youtubeStart":"130","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":3,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Disable Selection Events from History","name":"headline"},{"type":"regular","content":"Selection events can now be excluded from being logged in the History panel, allowing the preservation of existing selections while undoing or redoing other events.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"400","youtubeStart":"357","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":4,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Search Modules by Name and Keyword","name":"headline"},{"type":"regular","content":"Quickly locate modules directly by name, or use keywords describing associated categories, functions, or concepts — such as speech, noise, heal, and ambience.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"448","youtubeStart":"419","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":5,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"New Metering Options","name":"headline"},{"type":"regular","content":"The VU meter can now display peaks, RMS, or loudness. Other new metering features include a dedicated module which can dynamically provide comprehensive loudness data for entire projects, any combination of layers, and even selections in the spectrograph.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"492","youtubeStart":"476","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":6,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Module Information Help","name":"headline"},{"type":"regular","content":"When Tooltips are active, hovering over a module in the Modules panel or a module help icon displays descriptions of its functionality, keyboard shortcuts, and whether the module is affected by the currently selected FFT size.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"476","youtubeStart":"448","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":7,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"New Shortcuts","name":"headline"},{"type":"regular","content":"Easily assign keyboard shortcuts for interface layouts, tool presets, module presets, and module preset apply commands. Keyboard shortcut assignments are now available for more than 100 functions.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"209","youtubeStart":"183","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]}],"name":"tiles"}],"categories":[{"name":"Category Wall - New in - SpectraLayers 13"}]},{"type":"steinberg--text-media","variant":"intro","id":"992323","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Other Improvements"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992329","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"tag","type":"regular","content":"Elements"},{"name":"headline","type":"h3","content":"Batch Process Open Projects"},{"name":"text","type":"regular","content":"The full range of sophisticated batch processing options in SpectraLayers can now be applied across multiple open projects at once. Activate target projects in turn and choose specific layers for processing, then select the projects in the Batch Process Project Tabs dialog, define your modules chain, and apply. This new functionality is directly accessible in the main SpectraLayers interface, as well as via dropdown menu and keyboard shortcut."},{"name":"image","title":"","alt":"","alt_long":"","id":"992925","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_small_500px/992925-small.png","width":"500","height":"373"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_medium_1000px/992925-medium.png","width":"1000","height":"745"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_large_2000px/992925-large.png","width":"2000","height":"1490"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_extra-large_5500px/992925-extra-  in SpectraLayers 13"},"mobileAppStoreBadges":{"type":"","id":"","content":[{"productName":"","productFamily":"","productId":"","productType":{"dataType":"undefined"},"skus":[{"skuName":"","id":"","sapProductNumber":"","appleAppStoreId":null,"appleAppStoreName":"","appleAppStoreProviderToken":null,"appleAppStoreCampaignText":"","appleAppStoreMt":null},{"skuName":"","id":"","sapProductNumber":"","googlePlayStoreAppId":"","googlePlayStoreAppName":"","googlePlayStoreUtmSource":"","googlePlayStoreUtmCampaign":""}]}]},"navigationEndpoint":{"dataType":"undefined"},"openGraph":{"imageWidth":"1200","image":"https://ocl-steinberg-live.steinberg.net/_storage/asset/692421/storage/master/spectralayers-12-open-graph-01-1200-675.jpg","description":"SpectraLayers 13 sets a new quality bar in spectral audio editing for music, sound design, restoration, and repair.","siteName":" ","title":"What Is New in SpectraLayers 13","type":"website","imageHeight":"675"},"page":{"content":[{"type":"steinberg--hero","variant":"half-height","id":"992265","content":[{"id":"992883","name":"background","title":"","alt":"","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992883/storage/PNG_small_500px/992883-small.png","width":"500","height":"142"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992883/storage/PNG_medium_1000px/992883-medium.png","width":"1000","height":"284"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992883/storage/PNG_large_2000px/992883-large.png","width":"2000","height":"568"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992883/storage/PNG_extra-large_5500px/992883-extra-large.png","width":"3500","height":"993"}]},{"name":"link","youtubeId":"p959-8ipOHQ","title":""},{"name":"headline","type":"h1","content":"New in 13"}]},{"type":"steinberg--text-media","variant":"intro","id":"992268","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h1","content":"A new Era in Unmixing and Spectral Editing"},{"name":"text","type":"regular","content":"SpectraLayers 13 builds on the application’s core strengths with powerful new post-production options and workflow enhancements that span the entire application. Working in the spectrum is now more flexible than ever, while new tools for creative unmixing, speech refinement, audio reconstruction, and noise control make this edition ideal for contemporary workflows."}]}]}]},{"type":"steinberg--text-media","variant":"intro","id":"992271","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"New and Improved Modules"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain-big-image","id":"992274","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"headline","type":"h3","content":"Unmix Sound Effects"},{"name":"text","type":"regular","content":"This new process separates short sounds from continuous environmental and ambient background sounds, such as wind, crowd, traffic, and nature. Ideal for audio post, it enables fast, precise isolation of a very wide range of sounds, extracting them to their own dedicated layer while retaining the background texture. This can then be shaped and smoothed using other new processes in this version."},{"name":"image","title":"","alt":"","alt_long":"","id":"992885","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_small_500px/992885-small.png","width":"500","height":"292"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_medium_1000px/992885-medium.png","width":"1000","height":"584"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_large_2000px/992885-large.png","width":"2000","height":"1168"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992885/storage/PNG_extra-large_5500px/992885-extra-large.png","width":"3420","height":"1998"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"Video - SpectraLayers 13 - New in - 17fpH3C4EIU","assetId":"995670","youtubeId":"17fpH3C4EIU","youtubeTitle":"","youtubeStart":"20","youtubeEnd":"74"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain-big-image","id":"992277","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"headline","type":"h3","content":"Ambience Heal"},{"name":"text","type":"regular","content":"Automatically fill empty spaces in the audio spectrum left by unmixing and cut-to operations. For example, empty spaces previously occupied by voices on a source layer can be filled with the surrounding background texture (environment, room tone, etc) already present in the layer. The process references user-designated foreground layers containing content extracted from the source layer."},{"name":"image","title":"","alt":"","alt_long":"","id":"992887","alignment":"right","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992887/storage/PNG_small_500px/992887-small.png","width":"500","height":"292"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992887/storage/PNG_medium_1000px/992887-medium.png","width":"1000","height":"584"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992887/storage/PNG_large_2000px/992887-large.png","width":"2000","height":"1168"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992887/storage/PNG_extra-large_5500px/992887-extra-large.png","width":"3420","height":"1998"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"Video - SpectraLayers 13 - New in - 17fpH3C4EIU","assetId":"995670","youtubeId":"17fpH3C4EIU","youtubeTitle":"","youtubeStart":"74","youtubeEnd":"118"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992280","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"headline","type":"h3","content":"Reconstruct"},{"name":"text","type":"regular","content":"This new module resynthesizes selected spectral data. It analyzes and reconstructs tones (by tracking before and after selections), transients (by tracking above and below selections), and noise. Reconstruction amounts are configurable for all three components."},{"name":"image","title":"","alt":"","alt_long":"","id":"992889","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992889/storage/PNG_small_500px/992889-small.png","width":"500","height":"432"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992889/storage/PNG_medium_1000px/992889-medium.png","width":"1000","height":"865"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992889/storage/PNG_large_2000px/992889-large.png","width":"2000","height":"1729"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992889/storage/PNG_extra-large_5500px/992889-extra-large.png","width":"2311","height":"1998"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"Video - SpectraLayers 13 - New in - 17fpH3C4EIU","assetId":"995670","youtubeId":"17fpH3C4EIU","youtubeTitle":"","youtubeStart":"247","youtubeEnd":"284"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992283","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"tag","type":"regular","content":"Elements"},{"name":"headline","type":"h3","content":"Attenuate"},{"name":"text","type":"regular","content":"Attenuate relatively high-amplitude content within selections, based on the maximum spectral power of the surrounding content. This facilitates easy, natural-sounding blending with selection-adjacent content."},{"name":"image","title":"","alt":"","alt_long":"","id":"992891","alignment":"right","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992891/storage/PNG_small_500px/992891-small.png","width":"500","height":"398"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992891/storage/PNG_medium_1000px/992891-medium.png","width":"1000","height":"797"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992891/storage/PNG_large_2000px/992891-large.png","width":"2000","height":"1593"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992891/storage/PNG_extra-large_5500px/992891-extra-large.png","width":"2508","height":"1998"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"ThQXpLXZwdI - Video - SpectraLayers 13 - New in","assetId":"995671","youtubeId":"ThQXpLXZwdI","youtubeTitle":"","youtubeStart":"17","youtubeEnd":"64"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992286","columnNumber":3,"content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"headline","type":"h3","content":"Voice DeClick"},{"name":"text","type":"regular","content":"Remove unwanted mouth noises, such as lip smacks and tongue clicks. Threshold, pixel width, and reduction ratio controls are provided for fine-tuning the process."},{"name":"image","title":"","alt":"","alt_long":"","id":"992893","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992893/storage/PNG_small_500px/992893-small.png","width":"500","height":"331"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992893/storage/PNG_medium_1000px/992893-medium.png","width":"1000","height":"661"},{"type":"large","src":"https://ocl-stei t9eW0k","youtubeEnd":"357","youtubeStart":"334","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":2,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Interface Layout Presets","name":"headline"},{"type":"regular","content":"Save and recall interface states, including module and toolbar settings, for frequently used scenarios. Interface states can include anything that can be shown, hidden, docked, moved, or resized.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"183","youtubeStart":"130","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":3,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Disable Selection Events from History","name":"headline"},{"type":"regular","content":"Selection events can now be excluded from being logged in the History panel, allowing the preservation of existing selections while undoing or redoing other events.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"400","youtubeStart":"357","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":4,"associatedCategories":["Category Wall - New in - SpectraLayers 13"],"associatedSubCategories":[],"content":[{"type":"h3","content":"Search Modules by Name and Keyword","name":"headline"},{"type":"regular","content":"Quickly locate modules directly by name, or use keywords describing associated categories, functions, or concepts — such as speech, noise, heal, and ambience.","name":"text"},{"youtubeId":"xjH6Tt9eW0k","youtubeEnd":"448","youtubeStart":"419","name":"video"},{"type":"regular","content":"Pro","name":"tag"},{"type":"regular","content":"Elements","name":"tag"}]},{"order":5,"associatedCategori -text-media","variant":"intro","id":"992323","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Other Improvements"}]}]}]},{"type":"steinberg--text-media","variant":"text-box-plain","id":"992329","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"tag","type":"regular","content":"Pro"},{"name":"tag","type":"regular","content":"Elements"},{"name":"headline","type":"h3","content":"Batch Process Open Projects"},{"name":"text","type":"regular","content":"The full range of sophisticated batch processing options in SpectraLayers can now be applied across multiple open projects at once. Activate target projects in turn and choose specific layers for processing, then select the projects in the Batch Process Project Tabs dialog, define your modules chain, and apply. This new functionality is directly accessible in the main SpectraLayers interface, as well as via dropdown menu and keyboard shortcut."},{"name":"image","title":"","alt":"","alt_long":"","id":"992925","alignment":"left","src":[{"type":"small","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_small_500px/992925-small.png","width":"500","height":"373"},{"type":"medium","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_medium_1000px/992925-medium.png","width":"1000","height":"745"},{"type":"large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_large_2000px/992925-large.png","width":"2000","height":"1490"},{"type":"extra-large","src":"https://ocl-steinberg-live.steinberg.net/_storage/asset/992925/storage/PNG_extra-large_5500px/992925-extra-large.png","width":"2609","height":"1944"}],"caption":"","enlarge":"false"},{"name":"video","assetName":"xjH6Tt9eW0k - Video - SpectraLayers 13 - New in","assetId":"995672","youtubeId":"xjH6Tt9eW0k","youtubeTitle":"","youtubeStart":"21","youtubeEnd":"130"}]}]}]},{"type":"steinberg--text-media","variant":"text-bo
