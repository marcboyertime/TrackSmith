name: Tutor macOS Swift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tutor-macos-swift-pr-{0}', github.event.pull_request.number) || format('tutor-macos-swift-{0}-{1}', github.ref_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos_swift_core:
    name: macOS Swift core
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run locally reproducible Swift core lane
        run: bash scripts/ci/run-macos-swift-core.sh

  macos_tutor:
    name: macOS Tutor
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run locally reproducible Tutor lane
        run: bash scripts/ci/run-macos-tutor.sh

  macos_xcode_products:
    name: macOS Xcode products
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run locally reproducible unsigned Xcode product lane
        run: bash scripts/ci/run-macos-xcode-products.sh
      - name: Upload compact Xcode and Package 019 evidence
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-019-xcode-evidence
          path: |
            ${{ runner.temp }}/tracksmith-xcode-products/package019-ci-receipt.json
            ${{ runner.temp }}/tracksmith-xcode-products/xcode-products-report.json
          retention-days: 3
          if-no-files-found: error

  swift:
    name: swift
    if: ${{ always() }}
    needs: [macos_swift_core, macos_tutor, macos_xcode_products]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report required lane results
        run: |
          {
            echo '## Tutor macOS Swift aggregate'
            echo '| Lane | Result |'
            echo '| --- | --- |'
            echo '| macos_swift_core | ${{ needs.macos_swift_core.result }} |'
            echo '| macos_tutor | ${{ needs.macos_tutor.result }} |'
            echo '| macos_xcode_products | ${{ needs.macos_xcode_products.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
          test '${{ needs.macos_swift_core.result }}' = success
          test '${{ needs.macos_tutor.result }}' = success
          test '${{ needs.macos_xcode_products.result }}' = success
